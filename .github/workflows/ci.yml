name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The packed packages: exports, types and files as a user installing them from npm gets them.
      - run: pnpm check:packages

  layout:
    name: Layout (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Not blocking yet: the checks were written on macOS (fonts, scrollbars) and are still new on Linux.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:layout
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-screenshots
          path: .layout/
          retention-days: 14
